name: QA Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install selenium pytest pytest-html

    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1

    - name: Run tests
      run: python -m pytest tests/ -v --html=reports/report.html
      env:
        HEADLESS: true

    - name: Upload report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: reporte-html
        path: reports/report.html